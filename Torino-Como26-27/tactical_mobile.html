<script>
(()=>{'use strict';
// Roster, misure e regole desired derivati da V9. Rendering e clock sono V10.
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',TITLE='Torino-Como Tactical View';
const defsC=[['Sánchez',6,34,'GK'],['Kempf',24,18,'CB'],['Perrone',38,31,'PIV'],['Ramón',24,50,'CB'],['Valle',35,10,'FB'],['Couto',35,58,'FB'],['Milla',46,39,'CM'],['Caqueret',68,15,'W'],['Da Cunha',68,53,'W'],['Nico Paz',66,33,'AM'],['Douvikas',87,34,'ST']];
const defsT=[['Perri',101,34,'GK'],['Coco',79,17,'CB'],['Ismajli',80,34,'CB'],['Comuzzo',79,52,'CB'],['Belghali',68,8,'WB'],['Cacciamani',68,60,'WB'],['Vlašić',54,19,'CM'],['Bragança',54,34,'CM'],['Fitz-Jim',54,49,'CM'],['Adams',40,25,'ST'],['Simeone',40,44,'ST']];
const COLORS={free:'#187359',risk:'#966312',blocked:'#ad3549'},LABELS={free:'Disponibile*',risk:'Contesa',blocked:'Schermata'},SCENES={protect:'Protegge Nico',followMilla:'Segue Milla',followNico:'Segue Nico'};
const PARAM={ballSpeed:18,release:.12,defenderSpeed:4.8,reaction:.32,reach:.85,collision:1.2,control:.18};
const clone=o=>JSON.parse(JSON.stringify(o)),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),mix=(a,b,u)=>a+(b-a)*u,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ease=u=>u*u*(3-2*u);
const freeze=o=>{if(o&&typeof o==='object'){Object.freeze(o);Object.values(o).forEach(v=>{if(v&&typeof v==='object'&&!Object.isFrozen(v))freeze(v)})}return o};
const make=(defs,team)=>defs.map((d,id)=>({id,team,name:d[0],role:d[3],base:{x:d[1],y:d[2]},x:d[1],y:d[2],tx:d[1],ty:d[2],angle:team==='c'?0:Math.PI,pinned:false}));
const initial=()=>({C:make(defsC,'c'),T:make(defsT,'t'),owner:1,flight:null,pivot:false,scenario:'protect',pressing:'correct',decision:false,millaDrop:false,nicoShift:false,time:0,label:'Clicca un giocatore blu. Un clic, un passaggio; poi la lavagna si ferma.',action:'idle'});
let S=initial(),controller={mode:'manual',status:'idle',clip:null,elapsed:0,speed:1,stepEnd:null,pendingScenario:null},checkpoint=null,comparisonBase=null,snapshotSerial=0,history=[clone(S)],historyIndex=0,comparisonRuns={},view='explore',selected=null,showLines=true,showZones=false,showNames=false,showAll=false,showArrows=true,dirty=true,uiDirty=true,last=0,lastUI=0,drag=null,lastComparisonStart=null;

function movementControl(a,b,key,id){const d=dist(a,b),bend=d>.25?Math.min(.9,d*.085)*(key==='T'?(id===6?-1:id===8?1:id===7?-.6:0):(id===9?-1:id===6?1:0)):0;return{x:clamp((a.x+b.x)/2-(b.y-a.y)/(d||1)*bend,1,104),y:clamp((a.y+b.y)/2+(b.x-a.x)/(d||1)*bend,1,67)}}
function movementPoint(a,b,key,id,u){const c=movementControl(a,b,key,id),v=1-u;return{x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y}}
let texts={title:TITLE,caption:'',source:''};
// Fullback trap: close the forward corridors with real positions, leaving the recycle.
function wideTrap(s,ball){
 if(ball.x<20||ball.x>62||ball.y>16&&ball.y<52)return null;
 const sign=ball.y<34?-1:1,n=s.C[9],m=s.C[6],per=s.C[2],dx=n.x-ball.x,dy=n.y-ball.y,d=Math.hypot(dx,dy)||1;
 const px=clamp(ball.x+(n.x-ball.x)*.4,52.5,56.3),t=clamp((px-ball.x)/(dx||1),.1,.9),screen={x:mix(ball.x,n.x,t),y:mix(ball.y,n.y,t)};
 const bad=(sign<0&&s.pressing==='badVl')||(sign>0&&s.pressing==='badFj');
 // Wrong angle: the ball-side midfielder is pulled inside instead of closing the diagonal.
 const wrong={x:screen.x+sign*dy/d*7,y:screen.y-sign*dx/d*7};
 const coverT=clamp((57-ball.x)/(dx||1),.2,.85);
 return{sign,bad,mid:sign<0?6:8,striker:sign<0?9:10,screen,badScreen:wrong,
  millaScreen:{x:mix(ball.x,m.x,.5),y:mix(ball.y,m.y,.5)},
  perroneScreen:{x:per.x+(s.pivot?7:5),y:per.y-sign*2.5},
  centralCover:bad?{x:mix(ball.x,n.x,coverT),y:mix(ball.y,n.y,coverT)}:{x:54.3,y:34+sign*6.2}};
}
function desired(p,s,ball,context={}){
 const side=clamp((ball.y-34)/23,-1,1),top=ball.y<27,bottom=ball.y>41;
 if(p.pinned)return{x:p.x,y:p.y};
 if(p.team==='c'){
  if(p.id===0)return{x:6,y:34};
  if(p.id===2){const wide=ball.x>=20&&ball.x<=62&&(ball.y<=16||ball.y>=52);return{x:s.pivot?wide?26.5:24:wide?39.5:38,y:s.pivot?34:31}}
  if(p.id===1||p.id===3)return clone(p.base);
  if(p.id===4||p.id===5)return{x:s.pivot?49:35,y:p.id===4?10:58};
  if(p.id===6){
   if(s.decision&&s.scenario==='followNico')return{x:51.5,y:34};
   if(s.decision&&s.scenario==='followMilla'&&!wideTrap(s,ball)){if(context.holder<=5)return{x:43.5,y:top?43:bottom?25:44};return{x:p.x,y:p.y}}
   return{x:s.millaDrop?43.5:46,y:s.millaDrop?39.8:38.6};
  }
  if(p.id===9){
   if(s.decision&&s.scenario==='followMilla'&&!wideTrap(s,ball)){if(context.holder<=5)return{x:60.5,y:top?25:bottom?43:34};return{x:p.x,y:p.y}}
   return{x:s.nicoShift?67.1:66.2,y:s.nicoShift?(top?30.9:bottom?35.1:32.4):32.8};
  }
  // An optional receiving movement exploits the wrong diagonal: a winger comes short.
  // It remains a real trajectory; availability is still decided only by classify().
  if(p.id===7||p.id===8)return{x:(p.id===7&&s.pressing==='badVl'&&top||p.id===8&&s.pressing==='badFj'&&bottom)?55.5:68,y:p.id===7?14:54};
  return{x:87,y:34};
 }
 const trap=wideTrap(s,ball);
 if(trap){
  if(p.id===trap.mid)return trap.bad?trap.badScreen:trap.screen;
  if(p.id===trap.striker){if(s.decision&&s.scenario==='followNico')return{x:ball.x>=45?41.5:36.4,y:trap.sign>0?46.8:23.2};return trap.millaScreen}
  if(p.id===(trap.striker===9?10:9))return trap.perroneScreen;
  if(p.id===7){if(s.scenario==='followNico'&&s.decision){const n=context.markedNico||s.C[9];return{x:n.x-5.6,y:n.y+1.1}}if(s.scenario==='followMilla'&&s.decision)return{x:s.C[6].x+3.6,y:s.C[6].y+.3};return trap.centralCover}
 }
 if(s.decision&&s.scenario==='followMilla'&&!trap){
  if(p.id===6){if(top)return{x:46.5,y:12};if(!bottom)return{x:49,y:18.5}}
  if(p.id===8){if(bottom)return{x:46.5,y:56};if(!top)return{x:49,y:49.5}}
  if(p.id===9&&top)return{x:35.5,y:28.7+side*1.2};
  if(p.id===10&&bottom)return{x:35.5,y:39.3+side*1.2};
 }
 if(p.id===0)return{x:101,y:34};
 if([1,2,3].includes(p.id))return{x:p.base.x-(ball.x<51?1.9:.3),y:clamp(p.base.y+side*1.25,8,60)};
 if(p.id===4)return{x:68-(ball.x<51?1.8:.35),y:top?11.5:bottom?8.8:10};
 if(p.id===5)return{x:68-(ball.x<51?1.8:.35),y:bottom?56.5:top?59.2:58};
 if(p.id===6){if(s.pressing==='badVl'&&top)return{x:51,y:26.2};if(top&&ball.x>28)return{x:53.2,y:17.7};if(top)return{x:52.6,y:19.5};return{x:54.1,y:19.4+side*1.15}}
 if(p.id===8){if(s.pressing==='badFj'&&bottom)return{x:50.4,y:41.6};if(bottom&&ball.x>28)return{x:50.1,y:48.1};if(bottom)return{x:52.8,y:48.3};return{x:54,y:48.9+side*1.15}}

function drawWrapped(ctx,text,x,y,width,lineHeight,maxLines){
 const lines=[];let line='';for(const word of text.split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width<=width){line=next;continue}if(line){lines.push(line);line=''}for(const char of word){if(ctx.measureText(line+char).width>width&&line){lines.push(line);line=''}line+=char}}if(line)lines.push(line);
 const visible=lines.slice(0,maxLines);if(lines.length>maxLines){let end=visible[maxLines-1];while(end&&ctx.measureText(end+'…').width>width)end=end.slice(0,-1);visible[maxLines-1]=end+'…'}visible.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return visible.length*lineHeight;
}
